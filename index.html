<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Erotikus Társasjáték</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a2e, #16213e, #0f3460);
            color: #fff;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            max-width: 600px;
            width: 100%;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 25px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            border: 1px solid rgba(255, 255, 255, 0.1);
            text-align: center;
        }
        h1 {
            color: #e94560;
            margin-bottom: 10px;
            font-size: 1.8rem;
        }
        .level-badge {
            background: #e94560;
            color: white;
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 0.9rem;
            display: inline-block;
            margin-bottom: 20px;
        }
        .board-info {
            font-size: 1.2rem;
            margin-bottom: 20px;
            background: rgba(0,0,0,0.2);
            padding: 15px;
            border-radius: 10px;
        }
        button {
            background: linear-gradient(135deg, #e94560, #ff6b6b);
            color: white;
            border: none;
            padding: 12px 25px;
            font-size: 1rem;
            border-radius: 50px;
            cursor: pointer;
            font-weight: bold;
            box-shadow: 0 4px 15px rgba(233, 69, 96, 0.4);
            transition: 0.2s;
            margin: 5px;
        }
        button:hover {
            transform: scale(1.05);
        }
        .task-box {
            margin-top: 20px;
            padding: 20px;
            background: rgba(0,0,0,0.3);
            border-radius: 12px;
            display: none;
        }
        .timer {
            font-size: 1.5rem;
            color: #ff6b6b;
            font-weight: bold;
            margin-top: 15px;
        }
        .powerups {
            margin-top: 20px;
            display: flex;
            justify-content: center;
            gap: 10px;
        }
        .powerup-btn {
            background: #0f3460;
            border: 1px solid #e94560;
            font-size: 0.8rem;
            padding: 8px 12px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Ketten a Pályán</h1>
        <div class="level-badge" id="levelIndicator">1. Szint: Előjáték</div>

        <div class="board-info">
            Jelenlegi mező: <span id="position">1</span> / 30
        </div>

        <button onclick="rollDice()">🎲 Dobás a kockával</button>

        <div class="task-box" id="taskBox">
            <h3 id="taskTitle">Feladat</h3>
            <p id="taskDesc">Itt fog megjelenni a feladat leírása...</p>
            <div class="timer" id="timerDisplay"></div>
        </div>

        <div class="powerups">
            <button class="powerup-btn" onclick="usePowerUp('skip')">🚫 Elutasító (0)</button>
            <button class="powerup-btn" onclick="usePowerUp('swap')">🔄 Csere (0)</button>
        </div>
    </div>

    <script>
        let currentPos = 1;
        let skips = 1;
        let swaps = 1;

        const tasks = [
            { title: "Gyengéd simogatás", desc: "Simogasd meg a párod arcát lassan, miközben a szemébe nézel.", time: 30 },
            { title: "Forró csók", desc: "Adj egy legalább 20 másodperces, szenvedélyes csókot!", time: 20 },
            { title: "Suttogás", desc: "Suttogj a párod fülébe valami nagyon pajzaneszűt, amit ma este megtennél vele.", time: 0 },
            { title: "Vak-zóna meglepetés! 🎲", desc: "Húztok egy vak-kártyát: a párod válasszon egyet 1-5-ig, ami egy extra kihívást rejt!", time: 45 }
        ];

        function rollDice() {
            let dice = Math.floor(Math.random() * 3) + 1; // 1-3 lépés
            currentPos += dice;
            if (currentPos > 30) currentPos = 30;

            document.getElementById("position").innerText = currentPos;

            // Szintek váltása a pozíció alapján
            let levelText = "1. Szint: Előjáték";
            if (currentPos > 10 && currentPos <= 20) levelText = "2. Szint: Érzéki fázis";
            if (currentPos > 20) levelText = "3. Szint: Forró zóna";
            document.getElementById("levelIndicator").innerText = levelText;

            // Véletlenszerű feladat sorsolása
            let randomTask = tasks[Math.floor(Math.random() * tasks.length)];
            document.getElementById("taskTitle").innerText = randomTask.title;
            document.getElementById("taskDesc").innerText = randomTask.desc;

            let taskBox = document.getElementById("taskBox");
            taskBox.style.display = "block";

            // Időzítő indítása, ha van időhöz kötve
            if (randomTask.time > 0) {
                startTimer(randomTask.time);
            } else {
                document.getElementById("timerDisplay").innerText = "";
            }
        }

        function startTimer(duration) {
            let timerDisplay = document.getElementById("timerDisplay");
            let timeLeft = duration;
            timerDisplay.innerText = `Idő: ${timeLeft}s`;

            let timerInterval = setInterval(function () {
                timeLeft--;
                timerDisplay.innerText = `Idő: ${timeLeft}s`;
                if (timeLeft <= 0) {
                    clearInterval(timerInterval);
                    timerDisplay.innerText = "⏱️ Lejárt az idő!";
                }
            }, 1000);
        }

        function usePowerUp(type) {
            if (type === 'skip' && skips > 0) {
                skips--;
                alert("Felhasználtál egy Elutasító kártyát! Újra dobhatsz.");
                document.querySelector('.powerups button:nth-child(1)').innerText = `🚫 Elutasító (${skips})`;
                rollDice();
            } else if (type === 'swap' && swaps > 0) {
                swaps--;
                alert("Felhasználtál egy Csere kártyát! Ezt a feladatot most a párod csinálja meg rajtad.");
                document.querySelector('.powerups button:nth-child(2)').innerText = `🔄 Csere (${swaps})`;
            } else {
                alert("Nincs több ilyen kártyád!");
            }
        }
    </script>
</body>
</html>
