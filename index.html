<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Erotikus Társasjáték</title>
<style>
body {
font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
background: linear-gradient(135deg, #1a1a2e, #16213e, #0f3460);
color: #fff;
margin: 0;
padding: 15px;
display: flex;
flex-direction: column;
align-items: center;
min-height: 100vh;
}
.container {
max-width: 700px;
width: 100%;
background: rgba(255, 255, 255, 0.05);
backdrop-filter: blur(10px);
border-radius: 20px;
padding: 20px;
box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
border: 1px solid rgba(255, 255, 255, 0.1);
text-align: center;
}
h1 {
color: #e94560;
margin-bottom: 5px;
font-size: 1.6rem;
}
.level-badge {
background: #e94560;
color: white;
padding: 4px 12px;
border-radius: 20px;
font-size: 0.85rem;
display: inline-block;
margin-bottom: 15px;
}

/* Kacskaringós Tábla / Út Stílus */
.board {
display: grid;
grid-template-columns: repeat(6, 1fr);
gap: 10px;
margin-bottom: 20px;
background: rgba(0, 0, 0, 0.3);
padding: 15px;
border-radius: 15px;
border: 2px dashed rgba(233, 69, 96, 0.4);
}
.tile {
background: rgba(255, 255, 255, 0.08);
border-radius: 10px;
height: 50px;
display: flex;
align-items: center;
justify-content: center;
font-weight: bold;
font-size: 0.95rem;
position: relative;
border: 1px solid rgba(255, 255, 255, 0.1);
transition: 0.3s;
}

/* Szintek színei a mezőkön */
.tile.level-1 { border-color: #4ecca3; color: #4ecca3; }
.tile.level-2 { border-color: #f9ed69; color: #f9ed69; }
.tile.level-3 { border-color: #e94560; color: #e94560; }

/* Aktív bábu (ahol épp tartotok) */
.tile.active {
background: #e94560 !important;
color: white !important;
box-shadow: 0 0 20px #e94560;
transform: scale(1.15);
z-index: 10;
border: 2px solid #fff;
}

button {
background: linear-gradient(135deg, #e94560, #ff6b6b);
color: white;
border: none;
padding: 12px 25px;
font-size: 1rem;
border-radius: 50px;
cursor: pointer;
font-weight: bold;
box-shadow: 0 4px 15px rgba(233, 69, 96, 0.4);
transition: 0.2s;
margin: 5px;
}
button:hover {
transform: scale(1.05);
}
.task-box {
margin-top: 15px;
padding: 15px;
background: rgba(0,0,0,0.4);
border-radius: 12px;
display: none;
text-align: left;
border-left: 4px solid #e94560;
}
.task-box h3 {
margin-top: 0;
color: #ff6b6b;
font-size: 1.1rem;
text-align: center;
}
.timer {
font-size: 1.2rem;
color: #ff6b6b;
font-weight: bold;
margin-top: 10px;
text-align: center;
}
.powerups {
margin-top: 15px;
display: flex;
justify-content: center;
gap: 10px;
}
.powerup-btn {
background: #0f3460;
border: 1px solid #e94560;
font-size: 0.8rem;
padding: 8px 12px;
}
</style>
</head>
<body>

<div class="container">
<h1>Ketten a Pályán</h1>
<div class="level-badge" id="levelIndicator">1. Szint: Előjáték 🌿</div>

<!-- Kacskaringós Tábla -->
<div class="board" id="board"></div>

<button onclick="rollDice()">🎲 Dobás a kockával</button>

<div class="task-box" id="taskBox">
<h3 id="taskTitle">Feladat</h3>
<p id="taskDesc">Itt fog megjelenni a feladat leírása...</p>
<div class="timer" id="timerDisplay"></div>
</div>

<div class="powerups">
<button class="powerup-btn" onclick="usePowerUp('skip')">🚫 Elutasító (1)</button>
<button class="powerup-btn" onclick="usePowerUp('swap')">🔄 Csere (1)</button>
</div>
</div>

<script>
const totalTiles = 24;
let currentPos = 1;
let skips = 1;
let swaps = 1;

const tasks = [
{ title: "Gyengéd simogatás", desc: "Simogasd meg a párod arcát lassan, miközben a szemébe nézel.", time: 30 },
{ title: "Forró csók", desc: "Adj egy legalább 20 másodperces, szenvedélyes csókot!", time: 20 },
{ title: "Suttogás", desc: "Suttogj a párod fülébe valami pajzaneszűt, amit ma este megtennél vele.", time: 0 },
{ title: "Vak-zóna meglepetés! 🎲", desc: "Húztok egy vak-kártyát: a párod válasszon egyet 1-5-ig, ami egy extra kihívást rejt!", time: 45 },
{ title: "Érzéki masszázs", desc: "Válasszatok ki egy testrészt, és masszírozzátok 1 percig olajjal vagy kézzel.", time: 60 }
];

function createBoard() {
const board = document.getElementById("board");
board.innerHTML = "";
for (let i = 1; i <= totalTiles; i++) {
let tile = document.createElement("div");
tile.classList.add("tile");
tile.id = `tile-${i}`;
tile.innerText = i;

// Szintek szerinti besorolás (cserélődő színekkel)
if (i <= 8) tile.classList.add("level-1");
else if (i <= 16) tile.classList.add("level-2");
else tile.classList.add("level-3");

board.appendChild(tile);
}
updateBoardUI();
}

function updateBoardUI() {
for (let i = 1; i <= totalTiles; i++) {
let t = document.getElementById(`tile-${i}`);
if (i === currentPos) {
t.classList.add("active");
} else {
t.classList.remove("active");
}
}
}

function rollDice() {
let dice = Math.floor(Math.random() * 3) + 1; // 1-3 lépés
currentPos += dice;
if (currentPos > totalTiles) {
currentPos = totalTiles;
alert("Gratulálok, elértétek a célt! 🎉 Itt kezdődik az igazi főműsor...");
}

updateBoardUI();

let levelText = "1. Szint: Előjáték 🌿";
if (currentPos > 8 && currentPos <= 16) levelText = "2. Szint: Érzéki fázis 🔥";
if (currentPos > 16) levelText = "3. Szint: Forró zóna ❤️‍🔥";
document.getElementById("levelIndicator").innerText = levelText;

let randomTask = tasks[Math.floor(Math.random() * tasks.length)];
document.getElementById("taskTitle").innerText = `Mező #${currentPos} - ${randomTask.title}`;
document.getElementById("taskDesc").innerText = randomTask.desc;

let taskBox = document.getElementById("taskBox");
taskBox.style.display = "block";

if (randomTask.time > 0) {
startTimer(randomTask.time);
} else {
document.getElementById("timerDisplay").innerText = "";
}
}

function startTimer(duration) {
let timerDisplay = document.getElementById("timerDisplay");
let timeLeft = duration;
timerDisplay.innerText = `⏱️ Idő: ${timeLeft}s`;

let timerInterval = setInterval(function () {
timeLeft--;
timerDisplay.innerText = `⏱️ Idő: ${timeLeft}s`;
if (timeLeft <= 0) {
clearInterval(timerInterval);
timerDisplay.innerText = "⏰ Lejárt az idő!";
}
}, 1000);
}

function usePowerUp(type) {
if (type === 'skip' && skips > 0) {
skips--;
alert("Felhasználtál egy Elutasító kártyát!");
document.querySelector('.powerups button:nth-child(1)').innerText = `🚫 Elutasító (${skips})`;
} else if (type === 'swap' && swaps > 0) {
swaps--;
alert("Felhasználtál egy Csere kártyát!");
document.querySelector('.powerups button:nth-child(2)').innerText = `🔄 Csere (${swaps})`;
} else {
alert("Nincs több ilyen kártyád!");
}
}

createBoard();
</script>
</body>
</html>
