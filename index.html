<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Érzékek Játéka - Online</title>
<style>
body {
font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
color: #fff;
margin: 0;
padding: 10px;
display: flex;
flex-direction: column;
align-items: center;
min-height: 100vh;
}
.container {
max-width: 750px;
width: 100%;
background: rgba(255, 255, 255, 0.04);
backdrop-filter: blur(12px);
border-radius: 20px;
padding: 20px;
box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
border: 1px solid rgba(255, 255, 255, 0.1);
text-align: center;
}
h1 {
color: #ff477e;
margin-bottom: 5px;
font-size: 1.8rem;
letter-spacing: 1px;
}
.subtitle {
font-size: 0.9rem;
color: #b8b8d1;
margin-bottom: 15px;
}
.level-badge {
background: linear-gradient(135deg, #ff477e, #ff758c);
color: white;
padding: 6px 16px;
border-radius: 20px;
font-size: 0.9rem;
font-weight: bold;
display: inline-block;
margin-bottom: 20px;
box-shadow: 0 4px 15px rgba(255, 71, 126,.4);
}

/* Kacskaringós Tábla / Kígyózó Pálya Stílus */
.board {
display: grid;
grid-template-columns: repeat(6, 1fr);
gap: 10px;
margin-bottom: 25px;
background: rgba(0, 0, 0, 0.4);
padding: 15px;
border-radius: 16px;
border: 2px dashed rgba(255, 71, 126, 0.3);
}
.tile {
background: rgba(255, 255, 255, 0.06);
border-radius: 10px;
height: 55px;
display: flex;
flex-direction: column;
align-items: center;
justify-content: center;
font-weight: bold;
font-size: 0.9rem;
position: relative;
border: 1px solid rgba(255, 255, 255, 0.1);
transition: all 0.3s ease;
}
.tile span {
font-size: 0.65rem;
opacity: 0.7;
}

/* Szintek színei a táblán */
.tile.level-1 { border-bottom: 4px solid #00f5d4; color: #00f5d4; }
.tile.level-2 { border-bottom: 4px solid #fee440; color: #fee440; }
.tile.level-3 { border-bottom: 4px solid #ff477e; color: #ff477e; }

/* Aktív Bábu a mezőn */
.tile.active {
background: #ff477e !important;
color: white !important;
box-shadow: 0 0 25px #ff477e;
transform: scale(1.15);
z-index: 10;
border: 2px solid #fff;
}
.tile.active span {
color: #fff;
opacity: 1;
}

button.roll-btn {
background: linear-gradient(135deg, #ff477e, #f72585);
color: white;
border: none;
padding: 14px 30px;
font-size: 1.1rem;
border-radius: 50px;
cursor: pointer;
font-weight: bold;
box-shadow: 0 5px 20px rgba(247, 37, 133, 0.5);
transition: 0.2s;
margin-bottom: 15px;
}
button.roll-btn:hover {
transform: scale(1.05);
}

.task-box {
margin-top: 15px;
padding: 20px;
background: rgba(0, 0, 0, 0.5);
border-radius: 14px;
display: none;
text-align: left;
border-left: 5px solid #ff477e;
animation: fadeIn 0.4s ease;
}
@keyframes fadeIn {
from { opacity: 0; transform: translateY(10px); }
to { opacity: 1; transform: translateY(0); }
}
.task-box h3 {
margin-top: 0;
color: #ff758c;
font-size: 1.2rem;
text-align: center;
}
.timer {
font-size: 1.3rem;
color: #fee440;
font-weight: bold;
margin-top: 12px;
text-align: center;
}
.powerups {
margin-top: 20px;
display: flex;
justify-content: center;
gap: 12px;
}
.powerup-btn {
background: #1b1b2f;
border: 1px solid #ff477e;
color: #fff;
font-size: 0.85rem;
padding: 10px 15px;
border-radius: 8px;
cursor: pointer;
transition: 0.2s;
}
.powerup-btn:hover {
background: #ff477e;
}
</style>
</head>
<body>

<div class="container">
<h1>Érzékek Játéka</h1>
<div class="subtitle">Páros felfedezés, intimitás és szenvedély</div>
<div class="level-badge" id="levelIndicator">1. Szint: Előjáték (Intim zóna)</div>

<!-- Kacskaringós Tábla -->
<div class="board" id="board"></div>

<button class="roll-btn" onclick="rollDice()">🎲 Dobás a kockával</button>

<div class="task-box" id="taskBox">
<h3 id="taskTitle">Feladat</h3>
<p id="taskDesc">Itt jelenik meg a kártya tartalma...</p>
<div class="timer" id="timerDisplay"></div>
</div>

<div class="powerups">
<button class="powerup-btn" onclick="usePowerUp('skip')">🚫 Elutasító (1)</button>
<button class="powerup-btn" onclick="usePowerUp('swap')">🔄 Csere (1)</button>
</div>
</div>

<script>
const totalTiles = 24;
let currentPos = 1;
let skips = 1;
let swaps = 1;

// Az Érzékek Játéka stílusú tematikus kártyák szintekre bontva
const tasks = {
level1: [
{ title: "Gyengéd szemkontaktus", desc: "Nézzetek egymás szemébe szótlanul 30 másodpercig, miközben lassan simítjátok egymás arcát.", time: 30 },
{ title: "Suttogott vágy", desc: "Suttogj a párod fülébe egy olyan közös élményt, amit legszívesebben azonnal újra átélnél vele.", time: 0 },
{ title: "Lágy csók", desc: "Adj egy gyengéd, hosszan elnyújtott csókot a párod ajkára.", time: 20 }
],
level2: [
{ title: "Érzéki masszázs", desc: "Válasszatok ki egy testrészt (kéz, láb vagy nyak), és masszírozzátok át figyelmesen.", time: 60 },
{ title: "Felfedezés csukott szemmel", desc: "A párod csukja be a szemét (vagy használjatok kendőt), és finoman érints meg különböző pontokat a testén.", time: 45 },
{ title: "Szenvedélyes csók-hullám", desc: "Váltakozva adjatok egymásnak 3 apró, majd egy nagyon mély, szenvedélyes csókot.", time: 30 }
],
level3: [
{ title: "Forró zóna kihívás", desc: "Itt már nincs tabu: mondd el a legmerészebb fantáziádat, amit eddig nem mertél.", time: 0 },
{ title: "Intenzív érintés", desc: "1 percig csak a párod testének felső részére koncentráljatok, teljes átéléssel.", time: 60 },
{ title: "A vezetés átadása", desc: "A párod 1 percig azt tesz veled, amit csak akar – te csak élvezd és irányítsd a légzésed.", time: 60 }
]
};

function createBoard() {
const board = document.getElementById("board");
board.innerHTML = "";
for (let i = 1; i <= totalTiles; i++) {
let tile = document.createElement("div");
tile.classList.add("tile");
tile.id = `tile-${i}`;

let label = document.createElement("strong");
label.innerText = i;
tile.appendChild(label);

let sub = document.createElement("span");
if (i <= 8) {
tile.classList.add("level-1");
sub.innerText = "Intim";
} else if (i <= 16) {
tile.classList.add("level-2");
sub.innerText = "Érzéki";
} else {
tile.classList.add("level-3");
sub.innerText = "Forró";
}
tile.appendChild(sub);
board.appendChild(tile);
}
updateBoardUI();
}

function updateBoardUI() {
for (let i = 1; i <= totalTiles; i++) {
let t = document.getElementById(`tile-${i}`);
if (i === currentPos) {
t.classList.add("active");
} else {
t.classList.remove("active");
}
}
}

function rollDice() {
let dice = Math.floor(Math.random() * 3) + 1; // 1-3 lépés
currentPos += dice;
if (currentPos > totalTiles) {
currentPos = totalTiles;
alert("Elértétek a célt! 🎉 Most jön a fő attrakció...");
}

updateBoardUI();

// Szintek és kártyák kiválasztása a pozíció alapján
let levelKey = 'level1';
let levelText = "1. Szint: Előjáték (Intim zóna) 🌿";

if (currentPos > 8 && currentPos <= 16) {
levelKey = 'level2';
levelText = "2. Szint: Érzéki fázis 🔥";
} else if (currentPos > 16) {
levelKey = 'level3';
levelText = "3. Szint: Forró zóna (Hard) ❤️‍🔥";
}
document.getElementById("levelIndicator").innerText = levelText;

// Kártya sorsolás az adott zónából
let currentPool = tasks[levelKey];
let randomTask = currentPool[Math.floor(Math.random() * currentPool.length)];

document.getElementById("taskTitle").innerText = `Mező #${currentPos} - ${randomTask.title}`;
document.getElementById("taskDesc").innerText = randomTask.desc;

let taskBox = document.getElementById("taskBox");
taskBox.style.display = "block";

if (randomTask.time > 0) {
startTimer(randomTask.time);
} else {
document.getElementById("timerDisplay").innerText = "";
}
}

function startTimer(duration) {
let timerDisplay = document.getElementById("timerDisplay");
let timeLeft = duration;
timerDisplay.innerText = `⏱️ Idő: ${timeLeft}s`;

let timerInterval = setInterval(function () {
timeLeft--;
timerDisplay.innerText = `⏱️ Idő: ${timeLeft}s`;
if (timeLeft <= 0) {
clearInterval(timerInterval);
timerDisplay.innerText = "⏰ Lejárt az idő!";
}
}, 1000);
}

function usePowerUp(type) {
if (type === 'skip' && skips > 0) {
skips--;
alert("Elutasító kártya felhasználva! Ezt a feladatot kihagyhatjátok.");
document.querySelector('.powerups button:nth-child(1)').innerText = `🚫 Elutasító (${skips})`;
} else if (type === 'swap' && swaps > 0) {
swaps--;
alert("Csere kártya felhasználva! A feladat szerepet cserél.");
document.querySelector('.powerups button:nth-child(2)').innerText = `🔄 Csere (${swaps})`;
} else {
alert("Már felhasználtátok ezt a kártyát!");
}
}

createBoard();
</script>
</body>
</html>
